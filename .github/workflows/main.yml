# ============================================================
# CI Pipeline — Build & Push to ECR
# Triggers on push to main (production image)
# ============================================================

name: CI — Build & Push to ECR

on:
  push:
    branches:
      - main                          # Only build production image from main
    paths:                            # Skip build if only docs/k8s changed
      - 'main.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'nginx.aks.conf'
      - 'supervisord.conf'
      - 'webapp/**'
      - 'model/**'

  pull_request:
    branches:
      - main                          # Validate PR builds before merge
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'nginx.aks.conf'
      - 'supervisord.conf'
      - 'webapp/**'
      - 'model/**'

env:
  ECR_REGISTRY: 351611731527.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: mlsecops/app
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ──────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 3. Login to ECR ───────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Generate image tags ────────────────────────────
      # Tags: latest + short git SHA for traceability
      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_latest=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT

      # ── 5. Set up Docker Buildx (for multi-stage caching) ─
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 6. Build & Push ───────────────────────────────────
      # On push to main → build + push both tags
      # On pull_request  → build only (no push), validates Dockerfile
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}   # Push only on merge to main
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_latest }}
          # Cache layers in ECR to speed up future builds
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      # ── 7. Print image summary ────────────────────────────
      - name: Image build summary
        if: github.event_name == 'push'
        run: |
          echo "### Image pushed to ECR ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| SHA tag | \`${{ steps.meta.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest  | \`${{ steps.meta.outputs.image_latest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit  | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch  | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
