# ============================================================
# EKS Deployment Manifest — Crack Inspection (MLSecOps PFE)
# Cloud: AWS EKS (us-east-1)
# Ingress: nginx ingress controller
# TLS: Let's Encrypt via cert-manager (HTTP-01 challenge)
# Domain: crackinspection.duckdns.org
#
# Apply order:
#   1. kubectl apply -f eks-deployment.yaml  (HTTP only first)
#   2. Wait for cert: kubectl get certificate -n crack-inspection
#   3. kubectl apply -f eks-deployment-tls.yaml  (HTTPS after cert issued)
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: crack-inspection

---
# ============================================================
# Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crack-inspection
  namespace: crack-inspection
  labels:
    app: crack-inspection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crack-inspection
  template:
    metadata:
      labels:
        app: crack-inspection
    spec:
      containers:
        - name: crack-inspection
          image: 351611731527.dkr.ecr.us-east-1.amazonaws.com/mlsecops/app:939b013
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
            - name: api
              containerPort: 8000

          volumeMounts:
            - name: temp-storage
              mountPath: /app/temp

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

      volumes:
        - name: temp-storage
          emptyDir: {}

---
# ============================================================
# Service — ClusterIP
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: crack-inspection-svc
  namespace: crack-inspection
spec:
  selector:
    app: crack-inspection
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: api
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# ============================================================
# Ingress — PHASE 1: HTTP only
# nginx ingress controller — cert-manager HTTP-01 challenge
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crack-inspection-ingress
  namespace: crack-inspection
  annotations:
    # cert-manager issues the certificate automatically
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Increase timeouts for image processing
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - crackinspection.duckdns.org
      secretName: crack-inspection-tls
  rules:
    - host: crackinspection.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crack-inspection-svc
                port:
                  number: 80

---
# ============================================================
# HorizontalPodAutoscaler
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crack-inspection-hpa
  namespace: crack-inspection
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crack-inspection
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70