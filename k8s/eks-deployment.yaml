# ============================================================
# EKS Deployment Manifest — Crack Inspection (MLSecOps PFE)
# Cloud: AWS EKS (us-east-1)
# Ingress: AWS ALB (Load Balancer Controller)
# TLS: Let's Encrypt via cert-manager (HTTP-01 challenge)
# Domain: crackinspection.duckdns.org
#
# Apply order:
#   1. kubectl apply -f clusterissuer.yaml   (once, after cert-manager install)
#   2. kubectl apply -f eks-deployment.yaml  (HTTP only first)
#   3. Wait for cert: kubectl get certificate -n crack-inspection
#   4. kubectl apply -f eks-deployment-tls.yaml  (add SSL redirect after cert issued)
#
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: crack-inspection

---
# ============================================================
# Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crack-inspection
  namespace: crack-inspection
  labels:
    app: crack-inspection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crack-inspection
  template:
    metadata:
      labels:
        app: crack-inspection
    spec:
      containers:
        - name: crack-inspection
          # ECR image — tag updated automatically by CI/CD pipeline
          image: 351611731527.dkr.ecr.us-east-1.amazonaws.com/mlsecops/app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80       # Nginx (frontend + API proxy)
            - name: api
              containerPort: 8000     # Uvicorn (internal only, not exposed)

          volumeMounts:
            - name: temp-storage
              mountPath: /app/temp

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          # Resource limits — sized for t3.medium (2 vCPU, 4GB RAM)
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

      volumes:
        - name: temp-storage
          emptyDir: {}

---
# ============================================================
# Service — ClusterIP (ALB Ingress handles external access)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: crack-inspection-svc
  namespace: crack-inspection
spec:
  selector:
    app: crack-inspection
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# ============================================================
# Ingress — PHASE 1: HTTP only
# Purpose: Allow Let's Encrypt HTTP-01 challenge to succeed
# SSL redirect is intentionally OFF at this stage
# After cert is issued → apply eks-deployment-tls.yaml
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crack-inspection-ingress
  namespace: crack-inspection
  annotations:
    # AWS ALB controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # cert-manager will use HTTP-01 challenge on port 80
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # HTTP only for now — port 80 must be open for HTTP-01 challenge
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    # Timeouts for image processing
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120

    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

spec:
  tls:
    - hosts:
        - crackinspection.duckdns.org
      secretName: crack-inspection-tls   # cert-manager stores the cert here
  rules:
    - host: crackinspection.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crack-inspection-svc
                port:
                  number: 80

---
# ============================================================
# HorizontalPodAutoscaler — scale 1→3 pods on CPU
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crack-inspection-hpa
  namespace: crack-inspection
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crack-inspection
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
