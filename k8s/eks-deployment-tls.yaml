# ============================================================
# EKS Ingress — PHASE 2: HTTPS + SSL Redirect (nginx)
# Apply ONLY after certificate is successfully issued:
#   kubectl get certificate -n crack-inspection
#   (READY must be "True" before applying this file)
#
# Apply with: kubectl apply -f eks-deployment-tls.yaml
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crack-inspection-ingress
  namespace: crack-inspection
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Force HTTP → HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Timeouts for image processing
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - crackinspection.duckdns.org
      secretName: crack-inspection-tls
  rules:
    - host: crackinspection.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crack-inspection-svc
                port:
                  number: 80